name: Test and Publish

# One pipeline. Tests run on every push and pull request; publishing is a
# second job that only fires for a v*.*.* tag, and only after the tests
# have passed, so a release can never go out on a red suite.
#
# onlyPublish.sh still runs the same `npm run test` locally before it
# tags and pushes. This is the server-side backstop for that, and the
# only thing covering ordinary pushes and pull requests.
on:
  push:
    branches: ['**']
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

# Serialise releases. Two tags pushed close together would otherwise reach
# their publish steps at the same time, and `npm publish` is not something
# to race — nor is the changelog job, which pushes a branch and opens a PR.
#
# Every tag run shares one group and NEVER cancels. cancel-in-progress on a
# release is the precise failure this exists to prevent: a run killed
# between `npm publish` and the changelog/docs jobs leaves the registry
# ahead of the repository, which is exactly the divergence onlyPublish.sh
# already guards against locally.
#
# Everything else — branches, pull requests — groups per ref and does
# cancel, so a force-push supersedes its own in-flight run without ever
# queueing behind, or interfering with, a release.
concurrency:
  group: >-
    ${{ startsWith(github.ref, 'refs/tags/v')
        && 'release'
        || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # Decide in a few seconds whether this push is worth a full pipeline.
  #
  # `[skip ci]` on the changelog commit covers squash and rebase merges,
  # but a merge commit is named "Merge pull request #N from ..." by GitHub
  # and the marker is lost — so a docs-only merge still spent ~6 minutes
  # on tests, pack and scaffold. This gate catches that case, and any
  # other markdown-only push, by looking at what actually changed.
  #
  # Tags ALWAYS pass. A release must never be gated on file paths: that is
  # the failure mode `paths-ignore` risks, and it would silently skip
  # publishing.
  gate:
    name: Worth running?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          # Releases are never gated.
          case "$GITHUB_REF" in
            refs/tags/*) echo "tag push — always run"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"; HEAD="$PR_HEAD"
          else
            BASE="$BEFORE"; HEAD="$AFTER"
          fi

          # A new branch has an all-zero "before" and nothing to diff
          # against; anything ambiguous errs towards running.
          case "$BASE" in
            ""|0000000000000000000000000000000000000000)
              echo "no usable base ($BASE) — running"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          CHANGED=$(git diff --name-only "$BASE" "$HEAD" || true)
          if [ -z "$CHANGED" ]; then
            echo "no changed files resolved — running"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "changed files:"; echo "$CHANGED" | sed 's/^/  /'

          # Skip only when EVERY changed file is markdown. One source file
          # in the set and the pipeline runs.
          if echo "$CHANGED" | grep -qvE '\.md$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "markdown only — skipping the pipeline"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # onlyPublish.sh pushes main and then the tag, so a release fires TWO
    # push events against the identical commit and GitHub runs everything
    # twice. Only the tag run can publish, so the branch run is pure
    # duplication — and with the build at ~140s it was the single largest
    # waste in the pipeline.
    #
    # Reads as: always run for pull requests and manual dispatch, always
    # run for tags, and for a branch push run UNLESS it is a release
    # commit (which the tag run already covers).
    needs: gate
    if: >-
      needs.gate.outputs.run == 'true' &&
      (github.event_name != 'push' ||
       startsWith(github.ref, 'refs/tags/v') ||
       !startsWith(github.event.head_commit.message, 'release: v'))
    # Pinned read-only rather than inherited. This job installs third
    # party dependencies and downloads a browser, so it should hold no
    # token that could write to the repo or publish. Stating it here
    # means a later change to the repository's default workflow
    # permissions cannot silently widen it.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Retried: a registry or DNS blip should not take down a release.
      # `npm ci` deletes node_modules before it starts, so every attempt
      # begins from the same clean state — repeating it is always safe.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "::warning::npm ci failed (attempt $attempt/3) — retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::npm ci failed after 3 attempts"
          exit 1

      # dist/ must exist before the suite runs: __tests__/e2e/bundle.spec.js
      # loads public/bundle-smoke.html, which imports ../dist/index.esm.js —
      # the artefact consumers actually run. Every other fixture imports
      # source, so without this one spec a bundling regression (tree-shaking,
      # minifier rewrites, a webpack config change) passes the whole suite.
      - run: npm run build

      # Chromium only: the suite does not exercise other engines, and
      # --with-deps pulls the system libraries headless Chromium needs on
      # a bare runner. Rendering there goes through ANGLE/SwiftShader,
      # which still reports WebGL2 and EXT_color_buffer_float, so the
      # raster ops behave as they do locally.
      - name: Install Playwright Chromium
        # Azure-backed runners have no IPv6 route, but DNS still returns AAAA
        # records for cdn.playwright.dev. Node picks the AAAA, the connect
        # fails instantly with ENETUNREACH, and Playwright retries onto the
        # same address four times before giving up — a hard release failure
        # with nothing wrong in the repo (v1.0.217 died here). Preferring A
        # records keeps the download on the route the runner actually has.
        #
        # Retried as well: preferring A records removes the one cause we
        # diagnosed, not the class. The CDN can still blip, and re-running
        # the installer is idempotent — it skips a browser already present.
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install failed (attempt $attempt/3) — retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::playwright install failed after 3 attempts"
          exit 1

      # The Playwright config starts its own static server and enables
      # the HTML-in-Canvas origin trial with a launch flag, so the live
      # raster backend is covered here and not only the snapshot
      # fallback.
      # One runner for everything. Specs that request a `page` run in
      # Chromium; the rest (fixture-urls, raster-ops-unit) run in Node,
      # so there is no second test framework to install or configure.
      - name: Run tests
        run: npm run test

      # dist/ is built once here and reused by `pack` and `publish`
      # instead of each rebuilding it. Two benefits: it removes ~140s from
      # each of those jobs, and it means the artefact that is smoke-tested
      # and the artefact that is published are literally the same bytes,
      # rather than two builds trusted to be identical.
      - name: Upload dist for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7


  # Test what consumers actually install, not the source tree.
  #
  # The Playwright suite resolves ../layout/* and ../lib/* inside this repo,
  # so it never exercises package.json's main, exports, bin or files. All of
  # those can be wrong with the suite fully green — and one was: `main` and
  # `exports["."].require` pointed at ./dist/index.js while the build emits
  # dist/index.cjs.js, so require("nodality") failed with MODULE_NOT_FOUND
  # for every CommonJS consumer, across releases, invisibly.
  #
  # Packing and installing into a throwaway fixture is the only thing that
  # sees that class of bug. Gates publish alongside the test job.
  pack:
    name: Packaged tarball smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Retried: a registry or DNS blip should not take down a release.
      # `npm ci` deletes node_modules before it starts, so every attempt
      # begins from the same clean state — repeating it is always safe.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "::warning::npm ci failed (attempt $attempt/3) — retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::npm ci failed after 3 attempts"
          exit 1

      # Reuse the dist/ built by the test job rather than rebuilding it.
      - name: Download dist from the test job
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # inject-license rewrites files under layout/, not dist/, so it
      # still has to run against this job's own checkout.
      - run: npm run inject-license || true

      - name: Pack
        run: echo "TARBALL=$(npm pack --silent | tail -1)" >> "$GITHUB_ENV"

      - name: Install the tarball into a throwaway fixture
        run: |
          mkdir -p /tmp/pack-fixture
          cd /tmp/pack-fixture
          printf '{"name":"pack-smoke","version":"1.0.0","type":"module","private":true}\n' > package.json
          npm install "$GITHUB_WORKSPACE/$TARBALL"

      - name: Smoke test every published entry point
        run: node packaging/smoke.mjs /tmp/pack-fixture

      # Hand the very same tarball to the scaffold job, so it exercises
      # the bytes that just passed the smoke test rather than a rebuild.
      - name: Upload tarball for the scaffold job
        uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: ${{ env.TARBALL }}
          retention-days: 1


  # A real consumer, end to end.
  #
  # `pack` proves the package installs and its entry points resolve. It
  # does not prove that a project BUILT on top of the library still works.
  # This job scaffolds a fresh project with create-nodality, swaps in the
  # candidate tarball, and runs that project's own toolchain:
  #
  #   npm run build   -> webpack bundles nodality through a real bundler
  #   nodality prerender -> the CLI + SSG path every consumer depends on
  #
  # create-nodality is fetched at @latest deliberately: it is a separate
  # package on its own release cycle that was NOT updated in this commit,
  # which is what makes it a second opinion rather than an echo of the
  # suite. The cost is a network dependency — if this job fails, check
  # whether create-nodality changed before assuming the library broke.
  # Pin it (create-nodality@1.0.101) if release stability matters more
  # than catching scaffold drift.
  scaffold:
    name: Scaffolded project builds
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download the smoke-tested tarball
        uses: actions/download-artifact@v4
        with:
          name: tarball
          path: /tmp/tarball

      # Scaffolds, npm installs and builds on its own. At this point the
      # project is on the PUBLISHED nodality, not the candidate.
      - name: Scaffold a project with create-nodality
        run: |
          mkdir -p /tmp/scaffold && cd /tmp/scaffold
          npm create --yes nodality@latest smoke-app

      # Now replace the library with the candidate and rebuild. This is
      # the step that actually tests this release.
      - name: Install the candidate build over it
        run: |
          cd /tmp/scaffold/smoke-app
          npm install "$(ls /tmp/tarball/*.tgz | head -1)"
          node -p "'nodality in project: ' + require('./node_modules/nodality/package.json').version"

      - name: Rebuild the project against the candidate
        run: |
          cd /tmp/scaffold/smoke-app
          npm run build
          npx nodality prerender

      # Assert on rendered CONTENT, not file size. The scaffold's page is
      # deliberately tiny (~700 bytes), so a byte threshold either passes
      # trivially or fails a healthy build — the first draft of this step
      # asserted >1000 bytes and would have blocked every release.
      #
      # The shell ships `<div id="mount"></div>`; prerendering fills it.
      # So an empty mount is the exact signature of "the library loaded
      # but rendered nothing", which is what this job exists to catch.
      - name: Assert the prerender produced real HTML
        run: |
          cd /tmp/scaffold/smoke-app
          echo "--- upload/index.html ---"; cat upload/index.html
          test -f upload/index.html \
            || { echo "::error::prerender produced no upload/index.html"; exit 1; }
          # -E with <[a-zA-Z]: an EMPTY mount is `<div id="mount"></div>`,
          # whose next character is also '<', so a bare '<div id="mount"><'
          # matches it and the check passes for a page that rendered
          # nothing. Requiring a letter after '<' demands a real opening tag.
          grep -qE '<div id="mount"><[a-zA-Z]' upload/index.html \
            || { echo "::error::#mount is empty — nothing was prerendered into it"; exit 1; }
          grep -q 'Hello' upload/index.html \
            || { echo "::error::the component's text is missing from the output"; exit 1; }
          # Proves set() options reached the DOM during SSG, not merely that
          # an element was created.
          grep -q 'font-family: Arial' upload/index.html \
            || { echo "::error::set() styling did not reach the prerendered output"; exit 1; }
          echo "prerender output verified"

  publish:
    name: Publish to NPM
    needs: [test, pack, scaffold]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Node.js (includes npm).
      #
      # Pinned to 22 LTS because:
      #   - Node 18.20.0 ships npm 10.5, which has a known compatibility
      #     issue where publishing with --provenance fails with HTTP 404
      #     (PUT https://registry.npmjs.org/<pkg>) when a `bin` field is
      #     newly added to a previously-published package. The provenance
      #     statement signs cleanly, gets logged to sigstore, but the
      #     final registry PUT 404s. nodality 1.0.159 and 1.0.160 hit
      #     this — the WARN-cleaning of bin path / repo url that was
      #     blamed in 1.0.159 was fixed in package.json, but 1.0.160 still
      #     404'd with provenance flowing through npm 10.5.
      #   - Node 22 LTS ships npm 10.9+ which has the fix.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # 3. Install dependencies
      # Retried: a registry or DNS blip should not take down a release.
      # `npm ci` deletes node_modules before it starts, so every attempt
      # begins from the same clean state — repeating it is always safe.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "::warning::npm ci failed (attempt $attempt/3) — retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::npm ci failed after 3 attempts"
          exit 1

      # 6. Reuse the dist/ that the test job built and the pack job
      #    smoke-tested, rather than building a third copy. The build is
      #    reproducible (verified byte-identical across runs), but
      #    reusing it removes the need to trust that.
      - name: Download dist from the test job
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - run: npm run inject-license || true

      # 7. Verify version matches tag
      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          FILE_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "Version mismatch: tag=$VERSION, package.json=$FILE_VERSION"
            exit 1
          fi

      # 8. Publish to npm
      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  # Draft a CHANGELOG entry for the release just published.
  #
  # Runs AFTER publish, so it can never block or delay a release — the
  # package is already on npm by the time this starts. It opens a PR
  # rather than committing to main: a model writing release notes
  # unattended will eventually describe something that is not there, and
  # reviewing three bullets costs seconds.
  #
  # The script exits silently when a release changed nothing under
  # layout/, lib/ or bin/. That is not a rare edge case: inject-license
  # rewrites a version banner into ~97 files every release, so a CI-only
  # release like v1.0.205 produces a 97-line diff containing no real
  # changes at all. Describing that diff would be pure invention.
  changelog:
    name: Draft changelog
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The package is already on npm by the time this job starts, and this
    # job only drafts a PR — it cannot unpublish or corrupt the release.
    # Without this, a failure here marks the whole run red: v1.0.217
    # published successfully and still shows as failed, purely because the
    # changelog step died. That is worse than a missing entry, because it
    # trains you to read a red release as "probably just the changelog" —
    # and that is exactly how a genuine publish failure gets waved through.
    #
    # This does NOT hide the failure. The job still reports failed in the
    # job list and the script's ::error:: annotations still surface in the
    # run summary; only the RUN conclusion stops being dragged down. The
    # entry is recoverable at any time by re-running the job or writing it
    # by hand — the release itself is not.
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Full history and tags: the script diffs this tag against the
      # previous one, which a shallow clone cannot see.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No key configured is a normal state, not a failure — the release
      # itself already succeeded.
      - name: Skip if no API key is configured
        id: guard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY not set — skipping changelog draft."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate the entry
        if: steps.guard.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-changelog.mjs "${GITHUB_REF#refs/tags/}"

      # Nothing written means the release had no library changes.
      - name: Open a PR if an entry was written
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `git status --porcelain`, not `git diff --quiet`: the latter only
          # looks at TRACKED files, so on the first ever run — when the
          # script has just created CHANGELOG.md and git has never seen it —
          # it reports "no changes" and the entry is silently discarded.
          # --porcelain reports untracked files as "?? CHANGELOG.md".
          if [ -z "$(git status --porcelain -- CHANGELOG.md)" ]; then
            echo "No changelog entry produced — nothing to propose."
            exit 0
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          BRANCH="changelog/$TAG"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md
          # [skip ci] because this branch changes one markdown file and
          # nothing here can test it. Without it, merging the PR costs two
          # full runs — one for the pull_request event, one for the push to
          # main — each running tests, pack and scaffold for a doc change.
          # GitHub honours the marker on both events when it appears in the
          # head commit message.
          git commit -m "docs: changelog for $TAG [skip ci]"
          git push origin "$BRANCH"
          gh pr create \
            --title "docs: changelog for $TAG [skip ci]" \
            --body "Drafted from the source diff between the previous tag and \`$TAG\`, with version-banner lines filtered out. **Please read it against the diff before merging** — it is model-generated and describes only what the filtered diff contained." \
            --base main --head "$BRANCH"

  # Regenerate the API reference from the released tag and publish the
  # docs site — but only when the reference actually changed.
  #
  # Ordering: last. It reads `lib/raster-ops.js` at the tag, which only
  # exists once publish succeeded, and a docs problem must never colour a
  # successful release red.
  #
  # `needs: [publish, changelog]` with `always()`: changelog is skipped
  # when no ANTHROPIC_API_KEY is configured, and a skipped dependency
  # would otherwise skip this job too. The `if` therefore gates on
  # publish's result explicitly rather than on job ordering.
  #
  # PUBLISHES ONLY ON CHANGE. Most releases do not touch the raster
  # surface; without that gate this would republish the whole site on
  # every patch — a 200-file commit each time, burying real changes.
  docs:
    name: Publish API reference
    needs: [publish, changelog]
    if: always() && needs.publish.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      # No token configured is a normal state, not a failure — the release
      # already succeeded. Publishing the docs needs write access to TWO
      # other repositories (the docs source and the site), so it is a
      # deliberate opt-in rather than something that silently starts
      # working.
      - name: Skip if no docs token is configured
        id: guard
        env:
          DOCS_TOKEN: ${{ secrets.DOCS_PUBLISH_TOKEN }}
        run: |
          if [ -z "$DOCS_TOKEN" ]; then
            echo "DOCS_PUBLISH_TOKEN not set — skipping docs publish."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # The library, at the tag. This is the source the reference must
      # describe: what a reader can actually install.
      - name: Check out the library at the release tag
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          path: library

      - name: Check out the docs source
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: nodalityjs/docs
          token: ${{ secrets.DOCS_PUBLISH_TOKEN }}
          path: docs-src

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: '22'

      - name: Regenerate the reference
        if: steps.guard.outputs.run == 'true'
        id: gen
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # SRC_ROOT / DOCS_VERSION are the names the merged generator reads.
          # This passed the pre-merge names (RASTER_SRC/RASTER_VERSION), which
          # the script silently ignored — so it fell through to its
          # local-machine defaults and died on a macOS path no runner has.
          #
          # SRC_ROOT is the checkout root because the generator wants
          # lib/raster-ops.js AND layout/*.js from ONE place, which is exactly
          # how the library repo is laid out.
          OUT=$(SRC_ROOT="$GITHUB_WORKSPACE/library" \
                DOCS_VERSION="${TAG#v}" \
                node docs-src/scripts/generate-docs.mjs 2>&1) || {
            echo "$OUT"; echo "::error::docs generation failed"; exit 1; }
          echo "$OUT"
          if echo "$OUT" | grep -q "regenerated"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the regenerated reference
        if: steps.guard.outputs.run == 'true' && steps.gen.outputs.changed == 'true'
        working-directory: docs-src
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/raster docs/api
          git commit -m "docs: regenerate API reference for $TAG"
          git push origin HEAD:main

      # Reuse the repo's own deploy.sh rather than reimplementing the
      # publish here. That script carries properties learned the hard way:
      # a plain push instead of Docusaurus' force push, .nojekyll verified,
      # --delete for removed pages, .DS_Store excluded, and guards against
      # a stale or conflicted source tree. A second publishing path in YAML
      # would drift from those within a release or two.
      - name: Publish the site
        if: steps.guard.outputs.run == 'true' && steps.gen.outputs.changed == 'true'
        working-directory: docs-src
        env:
          DOCS_TOKEN: ${{ secrets.DOCS_PUBLISH_TOKEN }}
          # deploy.sh runs the generator in --check mode, and that check needs
          # a library to compare against. Without SRC_ROOT it falls back to
          # local-machine paths that do not exist on a runner, so verification
          # died before it could verify anything.
          #
          # The same root the previous step generated from, so the check
          # compares the committed docs against the source that produced them.
          SRC_ROOT: ${{ github.workspace }}/library
        run: |
          # Give deploy.sh push access to the site repo without editing it.
          git config --global url."https://x-access-token:${DOCS_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm ci
          # DOCS_VERSION stripped of its leading "v" here, because the
          # generate step wrote the footer with ${TAG#v}. Passing
          # github.ref_name verbatim would render "nodality v1.0.209"
          # against the committed "nodality 1.0.209" and fail --check.
          SITE_DIR="$RUNNER_TEMP/nodality-site" DOCS_VERSION="${GITHUB_REF_NAME#v}" ./deploy.sh

      - name: Report
        if: steps.guard.outputs.run == 'true' && steps.gen.outputs.changed == 'false'
        run: echo "API reference unchanged for this release — nothing published."
