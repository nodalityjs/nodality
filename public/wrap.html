<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wrap layout</title>
</head>
<body>
  <div id="mount"></div>
  <script type="module">

import { Des } from '../lib/designer.js';

// The three lines below used to be supplied by ElementMapper.mapWrap,
// which appended `new Text("Hello")` three times to EVERY wrap element in
// every page. That placeholder was removed in phase P3 so a wrap can carry
// its own content; this page now declares the content it always rendered.
let elements = [
  {
    type: "wrap",
    children: [
      { type: "p", text: "Hello" },
      { type: "p", text: "Hello" },
      { type: "p", text: "Hello" }
    ]
  }
];

let nodes = [
];

new Des()
  .nodes(nodes)
  .add(elements)
  .set({
    mount: "#mount"
  });


  </script>
</body>
</html>
