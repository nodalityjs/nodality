<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Des Test Page</title>
</head>
<body>
  <div id="mount"></div>
  <script type="module">

import { Des } from '../lib/designer.js';

// The filePicker mapper used to hardcode `id: "A"` and a
// "Add profile picture" title, so two pickers on one page produced
// duplicate DOM ids. The id and title belong to the element.
const elements = [{ type: 'filePicker', id: 'A', title: 'Add profile picture' }];
const nodes = [];

new Des()
  .nodes(nodes)
  .add(elements)
  .set({
    mount: '#mount',
    code: false
  });
  </script>
</body>
</html>
