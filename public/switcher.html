<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Switcher Test Page</title>
</head>
<body>
  <div id="mount"></div>
  <script type="module">

import { Des } from '../lib/designer.js';

// The multiswitcher mapper used to hardcode these three breakpoints, so
// every switcher everywhere showed First/Nice/Best. The views belong to
// the page; the spec still checks the breakpoint behaviour itself.
let elements = [
  {
    type: "multiswitcher",
    breakpoints: [
      { at: "0px",   view: { type: "p", text: "First" } },
      { at: "700px", view: { type: "p", text: "Nice" } },
      { at: "800px", view: { type: "p", text: "Best" } }
    ]
  }
];

new Des()
.add(elements)
.nodes([])
.set({
  mount: "#mount",
  code: true
});



  </script>
</body>
</html>
